<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P&ID Doküman</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="letterhead.css">
  <link rel="stylesheet" href="html-view.css">
</head>
<body class="view-pdf">
  <header class="app-toolbar">
    <div class="toolbar-left">
      <span class="app-title">P&ID Doküman</span>

      <div class="field">
        <label for="firmaSelect">Firma</label>
        <select id="firmaSelect">
          <option value="DOLFIN">DOLFIN</option>
          <option value="ENVA">ENVA</option>
          <option value="VICO">VICO</option>
          <option value="KSYSTEM">K.SYSTEM</option>
        </select>
      </div>

      <div class="field">
        <label for="modelSelect">Model</label>
        <select id="modelSelect" class="model-select">
          <option value="" selected>Model seçin</option>
          <option value="LYM 1">LYM 1</option>
          <option value="LYM 2">LYM 2</option>
          <option value="VDL 1">VDL 1</option>
          <option value="VDL 2">VDL 2</option>
          <option value="KBN 1">KBN 1</option>
          <option value="KBN 2">KBN 2</option>
          <option value="MST PRO">MST PRO</option>
          <option value="MST LVB">MST LVB</option>
          <option value="PYT">PYT</option>
          <option value="RTS 2">RTS 2</option>
          <option value="RTS 4">RTS 4</option>
          <option value="ULT 1">ULT 1</option>
          <option value="ULT 2">ULT 2</option>
          <option value="ULT 3">ULT 3</option>
          <option value="ULT 4">ULT 4</option>
          <option value="KNV 1">KNV 1</option>
          <option value="KNV 2">KNV 2</option>
          <option value="KNV 3">KNV 3</option>
        </select>
      </div>

      <div class="field">
        <label for="revInput">Rev</label>
        <input type="text" id="revInput" class="input-sm" value="01">
      </div>

      <div class="field">
        <label for="dateInput">Tarih</label>
        <input type="date" id="dateInput">
      </div>

      <button type="button" class="btn btn-process" id="processOverviewBtn">Process Overview</button>
      <button type="button" class="btn btn-matrix" id="safetyMatrixBtn">Safety Matrix</button>
      <button type="button" class="btn btn-component" id="pidComponentBtn">P&ID Component</button>
      <button type="button" class="btn btn-drawings" id="pidDrawingsBtn">P&ID Drawings</button>
    </div>

    <div class="toolbar-right">
      <div class="view-toggle">
        <button type="button" class="view-btn" data-view="html" title="Sürekli kaydırmalı HTML görünümü">HTML</button>
        <button type="button" class="view-btn active" data-view="pdf" title="Sayfalı A4 PDF önizleme">PDF</button>
      </div>

      <div class="lang-wrapper">
        <button type="button" class="lang-btn active" data-lang="tr" title="Türkçe">
          <img src="flags/tr.svg" alt="TR" class="flag-icon">
          <span>TR</span>
        </button>
        <button type="button" class="lang-btn" data-lang="en" title="English">
          <img src="flags/en.svg" alt="EN" class="flag-icon">
          <span>EN</span>
        </button>
        <button type="button" class="lang-btn" data-lang="de" title="Deutsch">
          <img src="flags/de.svg" alt="DE" class="flag-icon">
          <span>DE</span>
        </button>
      </div>

      <button type="button" class="btn btn-html" id="htmlBtn">HTML Kaydet</button>
      <button type="button" class="btn btn-primary" id="pdfBtn">PDF Kaydet</button>
    </div>
  </header>

  <main class="preview-area">
    <div id="pagesContainer" class="pages-container"></div>
  </main>

  <div id="processOverviewModal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal modal-wide" role="dialog" aria-labelledby="processOverviewModalTitle">
      <h2 id="processOverviewModalTitle" class="modal-title">Process Overview</h2>
      <p id="processOverviewModalDesc" class="modal-desc"></p>
      <div id="processOverviewList" class="modal-lang-list"></div>
      <div class="modal-actions">
        <button type="button" class="btn" id="processOverviewCancel">İptal</button>
        <button type="button" class="btn btn-primary" id="processOverviewConfirm">Uygula</button>
      </div>
    </div>
  </div>

  <div id="safetyMatrixModal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal modal-component-picker" role="dialog" aria-labelledby="safetyMatrixModalTitle">
      <h2 id="safetyMatrixModalTitle" class="modal-title">Safety Matrix</h2>
      <p id="safetyMatrixModalDesc" class="modal-desc"></p>
      <div class="component-picker-toolbar">
        <input type="search" id="safetyMatrixSearch" class="modal-input component-picker-search" autocomplete="off">
        <select id="safetyMatrixCategoryFilter" class="component-picker-filter"></select>
        <span id="safetyMatrixCount" class="component-picker-count"></span>
      </div>
      <div class="component-picker-actions">
        <button type="button" class="btn btn-sm" id="safetyMatrixSelectVisible">Görünenleri seç</button>
        <button type="button" class="btn btn-sm" id="safetyMatrixClearAll">Temizle</button>
      </div>
      <div id="safetyMatrixList" class="component-picker-list"></div>
      <div class="modal-actions">
        <button type="button" class="btn" id="safetyMatrixCancel">İptal</button>
        <button type="button" class="btn btn-primary" id="safetyMatrixConfirm">Uygula</button>
      </div>
    </div>
  </div>

  <div id="pidComponentModal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal modal-component-picker" role="dialog" aria-labelledby="pidComponentModalTitle">
      <h2 id="pidComponentModalTitle" class="modal-title">P&ID Component</h2>
      <p id="pidComponentModalDesc" class="modal-desc"></p>
      <div class="component-picker-toolbar">
        <input type="search" id="pidComponentSearch" class="modal-input component-picker-search" autocomplete="off">
        <select id="pidComponentCategoryFilter" class="component-picker-filter"></select>
        <span id="pidComponentCount" class="component-picker-count"></span>
      </div>
      <div class="component-picker-actions">
        <button type="button" class="btn btn-sm" id="pidComponentSelectVisible">Görünenleri seç</button>
        <button type="button" class="btn btn-sm" id="pidComponentClearAll">Temizle</button>
      </div>
      <div id="pidComponentList" class="component-picker-list"></div>
      <div class="modal-actions">
        <button type="button" class="btn" id="pidComponentCancel">İptal</button>
        <button type="button" class="btn btn-primary" id="pidComponentConfirm">Uygula</button>
      </div>
    </div>
  </div>

  <div id="pidDrawingsModal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal modal-drawings" role="dialog" aria-labelledby="pidDrawingsModalTitle">
      <h2 id="pidDrawingsModalTitle" class="modal-title">P&ID Drawings</h2>
      <p id="pidDrawingsModalDesc" class="modal-desc"></p>
      <nav id="drawingsBreadcrumb" class="drawings-breadcrumb" aria-label="Drawings path"></nav>
      <div class="drawings-browser">
        <aside class="drawings-sidebar">
          <div id="drawingsFamiliesTitle" class="drawings-panel-title">Seriler</div>
          <div id="drawingsFamilies" class="drawings-family-list"></div>
        </aside>
        <div class="drawings-main">
          <div class="drawings-panel">
            <div id="drawingsFoldersTitle" class="drawings-panel-title">Klasörler</div>
            <div id="drawingsFolders" class="drawings-grid"></div>
          </div>
          <div class="drawings-panel">
            <div id="drawingsFilesTitle" class="drawings-panel-title">SVG Dosyaları</div>
            <div id="drawingsFiles" class="drawings-grid drawings-file-grid"></div>
          </div>
        </div>
      </div>
      <div class="drawings-selected-wrap">
        <div id="drawingsSelectedTitle" class="drawings-panel-title">Seçilen çizimler</div>
        <div id="drawingsSelected" class="drawings-selected"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="pidDrawingsCancel">İptal</button>
        <button type="button" class="btn btn-primary" id="pidDrawingsConfirm">Uygula</button>
      </div>
    </div>
  </div>

  <div id="exportModal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal" role="dialog" aria-labelledby="exportModalTitle">
      <h2 id="exportModalTitle" class="modal-title">Dışa Aktar</h2>
      <p id="exportModalDesc" class="modal-desc"></p>
      <div id="exportLangList" class="modal-lang-list"></div>
      <div class="modal-field">
        <label for="exportFileName" id="exportFileNameLabel">Dosya adı</label>
        <div class="modal-filename-row">
          <input type="text" id="exportFileName" class="modal-input" placeholder="0226078-VICO-LYM 1350" autocomplete="off">
          <span class="modal-filename-suffix">P&amp;ID DIAGRAM</span>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="exportCancel">İptal</button>
        <button type="button" class="btn btn-primary" id="exportConfirm">Oluştur</button>
      </div>
    </div>
  </div>

  <script src="cover.js"></script>
  <script src="header.js"></script>
  <script src="page-builder.js"></script>
  <script src="safety-matrix.js"></script>
  <script src="process-overview.js"></script>
  <script src="pid-component.js"></script>
  <script src="pid-drawings.js"></script>
  <script src="color-coding.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
